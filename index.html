        @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
        @tailwind base;
        @tailwind components;
        @tailwind utilities;
        :root{
          --bg:#FAF9F6;
          --surface:#FFFFFF;
          --surface-2:#F4EFE8;
          --border:#E7E0D6;
          --border-strong:#D6CEC1;
          --text:#171717;
          --muted:#57534E;
          --faint:#78716C;
          --rust:#8B3A2E;
          --selection:#A8D8EA;
          --cyan:#0E7490;
          --green:#15803D;
          --card-shadow: 0 1px 3px rgba(16,24,40,0.06), 0 1px 2px rgba(16,24,40,0.05);
          --card-shadow-hover: 0 8px 20px rgba(16,24,40,0.08), 0 2px 8px rgba(16,24,40,0.06);
        }
        [data-theme="rust"]{
          --bg:#8B3A2E;
          --surface:#6D2E24;
          --surface-2:#5A231C;
          --border:#8A3F34;
          --border-strong:#A14A3C;
          --text:#FFF7ED;
          --muted:#F5D6C8;
          --faint:#D6A99C;
          --selection:#A8D8EA;
          --cyan:#7DD3E0;
          --green:#86EFAC;
          --card-shadow: 0 4px 20px rgba(0,0,0,0.28);
          --card-shadow-hover: 0 10px 28px rgba(0,0,0,0.36);
        }
        *{box-sizing:border-box}
        ::selection{background:var(--selection); color:#0F172A}
        html{scroll-behavior:smooth}
        body{margin:0}
        a{color:inherit}
        .mono{font-family:'JetBrains Mono',monospace}
        .serif{font-family:'Instrument Serif',serif}
        /* THEME TOGGLE - water-blue selection kept, but toggle itself high contrast */
        .theme-toggle{
          position:fixed;
          top:18px;
          right:20px;
          width:58px;
          height:32px;
          background:var(--surface);
          border:1.5px solid var(--border-strong);
          border-radius:999px;
          cursor:pointer;
          display:flex;
          align-items:center;
          padding:3px;
          z-index:50;
          transition:all .28s ease;
          box-shadow: var(--card-shadow);
        }
        [data-theme="rust"] .theme-toggle{
          background:#4A1D16;
          border-color:#8A3F34;
        }
        .knob{
          width:24px;
          height:24px;
          background:#FFFFFF;
          border-radius:50%;
          box-shadow:0 1px 4px rgba(0,0,0,0.2);
          transform:translateX(0);
          transition:transform .32s cubic-bezier(.34,1.26,.64,1);
          display:grid;
          place-items:center;
        }
        [data-theme="rust"] .knob{
          transform:translateX(24px);
          background:#FFF7ED;
        }
        .knob-dot{
          width:8px;height:8px;border-radius:50%;
          background:var(--rust);
          box-shadow:0 0 0 2px rgba(139,58,46,0.12) inset;
        }
        /* INDEX PAGE */
        .index-wrap{max-width:680px;margin:0 auto;padding:84px 24px 60px}
        .top{display:flex;align-items:center;gap:20px;margin-bottom:42px}
        .avatar-stack{
          width:88px;height:88px;min-width:88px;min-height:88px;
          position:relative;flex-shrink:0;border-radius:18px;
          overflow:hidden;background:#E8E2D9;
          box-shadow:0 2px 12px rgba(0,0,0,0.12);
          cursor:pointer;
          border:1.5px solid var(--border);
        }
